name: Install H5014 map bundle

on:
  push:
    branches: [main]
    paths:
      - 'H5014_HighRes_Gaode_GitHub_Pages.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Expand validated archive
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path('H5014_HighRes_Gaode_GitHub_Pages.zip')
          if not archive.exists():
              raise FileNotFoundError(f'Missing {archive}')
          with ZipFile(archive) as z:
              for info in z.infolist():
                  path = Path(info.filename)
                  if path.is_absolute() or '..' in path.parts:
                      raise ValueError(f'Unsafe path: {info.filename}')
              z.extractall('.')
          archive.unlink()
          PY
      - name: Commit unpacked assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Install H5014 high-resolution geological map assets"
            git push
          fi
